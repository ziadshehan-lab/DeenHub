name: Build Android APK

# يبني حزمة APK تلقائياً عند الدفع إلى فرع التطوير أو يدوياً من تبويب Actions
on:
  push:
    branches:
      - claude/deenhub-islamic-app-h3xpok
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-apk:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # مطلوب لبناء أندرويد (يشمل core library desugaring لحزمة الإشعارات)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable 3.32.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deenhub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
