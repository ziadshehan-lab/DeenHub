name: deenhub
description: "DeenHub - تطبيق إسلامي شامل (قرآن، تفسير، حديث، أذكار، مواقيت الصلاة، مكتبة إسلامية)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP API ready
  http: ^1.2.2

  # Local cache ready
  shared_preferences: ^2.3.3

  # مشاركة الآيات
  share_plus: ^10.1.4

  # الانتقال إلى آية محددة داخل قائمة القراءة
  scrollable_positioned_list: ^0.3.8

  # تحديد موقع المستخدم لمواقيت الصلاة والقبلة
  geolocator: ^13.0.2

  # تذكيرات الصلاة المحلية (أندرويد و iOS) مع جدولة آمنة زمنياً
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # JSON assets ready - local Islamic content data files
  assets:
    - lib/assets_data/
    - lib/assets_data/quran/
    - lib/assets_data/tafsir/
    - lib/assets_data/tafsir/saadi/
    - lib/assets_data/hadith/
    - lib/assets_data/prayer/
    - lib/assets_data/adhkar/
    - lib/assets_data/library/

  # خط أميري — خط عربي محسّن لعرض النص القرآني (رخصة OFL)
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
